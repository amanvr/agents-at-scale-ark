apiVersion: v1
kind: ServiceAccount
metadata:
  name: ark-substrate-executor
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ark-substrate-executor
rules:
  - apiGroups: ["ark.mckinsey.com"]
    resources: ["agents", "models", "queries", "teams", "tools", "mcpservers", "memories", "a2atasks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ark.mckinsey.com"]
    resources: ["queries/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["ark.mckinsey.com"]
    resources: ["executionengines"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ark-substrate-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ark-substrate-executor
subjects:
  - kind: ServiceAccount
    name: ark-substrate-executor
    namespace: {{ .Release.Namespace }}
