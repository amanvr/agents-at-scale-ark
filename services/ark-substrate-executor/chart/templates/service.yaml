apiVersion: v1
kind: Service
metadata:
  name: ark-substrate-executor
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: ark-substrate-executor }
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
---
apiVersion: ark.mckinsey.com/v1prealpha1
kind: ExecutionEngine
metadata:
  name: {{ .Values.executionEngine.name }}
  namespace: {{ .Release.Namespace }}
spec:
  address:
    value: "http://ark-substrate-executor.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
  description: {{ .Values.executionEngine.description | quote }}
