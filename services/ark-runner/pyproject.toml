[project]
name = "ark-runner"
version = "0.1.0"
description = "Config-driven Ark agent runner: PID-1 in a Substrate sandbox, runs an agent from its Agent/Model/Tool spec via a framework adapter."
requires-python = ">=3.11"
dependencies = [
    "ark-sdk",
    "httpx",
]

[project.optional-dependencies]
# Framework adapters are optional so the base image stays lean; a langchain- or claude-
# flavored runner image installs the matching extra. Adapter imports are lazy, so a missing
# extra only fails when that framework is actually selected.
langchain = ["langchain-core", "langchain-openai"]
claude = ["claude-agent-sdk"]
test = ["pytest", "pytest-asyncio", "ruff", "langchain-core", "langchain-openai", "claude-agent-sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ark_runner"]
