# Turn 1: state a fact. Shares conversationId with turn 2 so history carries over.
apiVersion: ark.mckinsey.com/v1alpha1
kind: Query
metadata:
  name: substrate-sessions-1
spec:
  input: "My favorite color is teal. Reply with just: ok"
  target:
    type: agent
    name: substrate-sessions-agent
  memory:
    name: default
    namespace: default
  conversationId: substrate-sessions-conv
  ttl: 1h0m0s
