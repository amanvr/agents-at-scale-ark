# Model the sandboxed agents call. Supply the gateway token via the openai-gateway-key
# secret before running (see the executor BRINGUP.md), or repoint at an in-cluster mock-llm.
# Under egress enforcement this host is derived from baseUrl into the actor's allowlist.
apiVersion: ark.mckinsey.com/v1alpha1
kind: Model
metadata:
  name: substrate-egress-model
spec:
  provider: openai
  model:
    value: gpt-5-nano-2025-08-07
  config:
    openai:
      baseUrl:
        value: "https://openai.prod.ai-gateway.quantumblack.com/b894067e-6530-4890-aa17-e4d5a999acf4/v1"
      apiKey:
        valueFrom:
          secretKeyRef:
            name: openai-gateway-key
            key: token
